<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>
  <link rel="stylesheet" href="instagram.css">
</head>
<body>

  <div class="page">

    <div class="part1">
      <div class="logo">
        <img src="./Images/instagram.png" alt="Instagram Logo" />
      </div>

      <div class="background">
        <h1>
          See everyday moments from your <br>
          <span>close friends</span>.
        </h1>
        <img src="./Images/pAv7hjq-51n.png" alt="Background Image" />
      </div>
    </div>

    <div class="content2"></div>

    <div class="part2">
      <div class="login-box">
        <b>Log in to Instagram</b>

        <input type="text" placeholder="Mobile number, username or email address">
        <input type="password" placeholder="Password">

        <button class="login">Log in</button>
        <button class="forgot">Forgotten password?</button>

        <button class="facebook">Log in with Facebook</button>
        <button class="create">Create new account</button>

        <small>© Meta</small>
      </div>
    </div>

  </div>

  <footer class="footer">
    <div class="footer-links">
      <a href="#">Meta</a>
      <a href="#">About</a>
      <a href="#">Blog</a>
      <a href="#">Jobs</a>
      <a href="#">Help</a>
      <a href="#">API</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Locations</a>
      <a href="#">Instagram Lite</a>
      <a href="#">Meta AI</a>
      <a href="#">Threads</a>
      <a href="#">Contact uploading and non-users</a>
      <a href="#">Meta Verified</a>
    </div>

    <div class="footer-bottom">
      <span>English (UK)</span>
      <span>© 2026 Instagram from Meta</span>
    </div>
  </footer>

</body>
</html>
